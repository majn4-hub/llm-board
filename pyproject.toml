[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-board"
version = "0.1.0"
description = "A desktop panel that answers two questions: how long will your AI credits last, and who spent them?"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
llm-board = "llm_board.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_board*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
