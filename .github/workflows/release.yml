name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & attach artifacts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Python package (sdist + wheel)
        run: |
          python -m pip install build
          python -m build
      - name: Compile Swift panel (unsigned)
        run: swiftc -O -swift-version 5 src/ui/llm_monitor_desktop.swift -o llm-monitor
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* llm-monitor \
            --title "$GITHUB_REF_NAME" --generate-notes
